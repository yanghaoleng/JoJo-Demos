<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FCDA00">
  <meta name="description" content="JOJO 儿童社区 Mock 用户信息流 Demo">
  <title>一起学习 - 儿童社区 Demo</title>
  <link rel="stylesheet" href="../../assets/vendor/phosphor-icons/fill/style.css">
  <style>
    @font-face {
      font-family: "Mohr Rounded";
      src: url("../../assets/字体/MohrRounded-Bold.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }

    :root {
      color-scheme: light dark;
      --yellow-1: #fcf9de;
      --yellow-2: #fcf3ba;
      --yellow-3: #ffeb6b;
      --yellow-4: #fcda00;
      --yellow-5: #dbaf00;
      --yellow-6: #544300;
      --ink: #2f2a1f;
      --text: #404040;
      --text-soft: #666666;
      --text-faint: #8b8b8b;
      --surface: #ffffff;
      --surface-soft: #fafafa;
      --line: #ecebe8;
      --page: #f8f7f3;
      --online: #5dc43b;
      --online-soft: #effaeb;
      --reading: #ff9045;
      --reading-soft: #fff3eb;
      --creating: #ae84e3;
      --creating-soft: #f9f5ff;
      --resting: #919fb9;
      --resting-soft: #f5f8fd;
      --focus: #0090d9;
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-pill: 999px;
      --shadow-soft: 0 18px 56px rgba(64, 64, 64, 0.10);
      --motion-quick: 160ms;
      --motion-enter: 520ms;
      --motion-standard: cubic-bezier(0.22, 1, 0.36, 1);
      --motion-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--page);
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      background:
        radial-gradient(circle at 12% 2%, rgba(252, 218, 0, 0.24), transparent 28rem),
        var(--page);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .app {
      width: min(100%, 760px);
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--surface);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
      padding: 12px 20px;
      border-bottom: 1px solid color-mix(in srgb, var(--line) 78%, transparent);
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 2px solid var(--yellow-5);
      border-radius: 14px;
      background: var(--yellow-4);
      color: var(--yellow-6);
      font: 700 22px/1 "Mohr Rounded", "PingFang SC", sans-serif;
      transform: rotate(-3deg);
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-copy strong,
    .brand-copy span {
      display: block;
    }

    .brand-copy strong {
      color: var(--ink);
      font-size: 17px;
      line-height: 1.25;
    }

    .brand-copy span {
      margin-top: 2px;
      color: var(--text-soft);
      font-size: 12px;
      line-height: 1.35;
    }

    .icon-button {
      display: inline-grid;
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius-pill);
      background: var(--surface);
      cursor: pointer;
      transition:
        transform var(--motion-quick) ease-out,
        background-color var(--motion-quick) ease-out,
        border-color var(--motion-quick) ease-out;
    }

    .icon-button:hover {
      border-color: var(--yellow-5);
      background: var(--yellow-2);
    }

    .icon-button:active {
      transform: scale(0.94);
    }

    .icon-button i {
      font-size: 22px;
    }

    .content {
      padding: 20px 20px 56px;
    }

    .welcome {
      position: relative;
      overflow: hidden;
      padding: 24px;
      border: 1px solid #f4df56;
      border-radius: var(--radius-lg);
      background: var(--yellow-1);
    }

    .welcome::after {
      position: absolute;
      right: -26px;
      bottom: -42px;
      width: 136px;
      height: 136px;
      border-radius: 50%;
      background: var(--yellow-3);
      content: "";
      opacity: 0.58;
    }

    .welcome > * {
      position: relative;
      z-index: 1;
    }

    .welcome h1 {
      max-width: 10em;
      margin: 0;
      color: var(--ink);
      font-size: clamp(25px, 7vw, 34px);
      line-height: 1.18;
      letter-spacing: -0.03em;
    }

    .welcome p {
      max-width: 30em;
      margin: 10px 0 0;
      color: var(--yellow-6);
      font-size: 14px;
      line-height: 1.6;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      margin-top: 20px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface-soft);
      transition:
        border-color var(--motion-quick) ease-out,
        box-shadow var(--motion-quick) ease-out,
        background-color var(--motion-quick) ease-out;
    }

    .search:focus-within {
      border-color: var(--focus);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(51, 187, 255, 0.18);
    }

    .search i {
      color: var(--text-faint);
      font-size: 20px;
    }

    .search input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 15px;
    }

    .search input::placeholder {
      color: var(--text-faint);
    }

    .filters {
      display: flex;
      gap: 8px;
      margin: 14px -20px 0;
      padding: 0 20px 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter {
      min-height: 40px;
      flex: 0 0 auto;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-pill);
      background: var(--surface);
      color: var(--text-soft);
      cursor: pointer;
      transition:
        transform var(--motion-quick) ease-out,
        color var(--motion-quick) ease-out,
        background-color var(--motion-quick) ease-out,
        border-color var(--motion-quick) ease-out;
    }

    .filter:hover {
      border-color: var(--yellow-5);
      color: var(--yellow-6);
    }

    .filter:active {
      transform: scale(0.96);
    }

    .filter[aria-pressed="true"] {
      border-color: var(--yellow-5);
      background: var(--yellow-4);
      color: var(--yellow-6);
      font-weight: 600;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 28px 0 6px;
    }

    .section-head h2 {
      margin: 0;
      color: var(--ink);
      font-size: 20px;
      line-height: 1.4;
    }

    .section-head span {
      color: var(--text-soft);
      font: 700 13px/1.4 "Mohr Rounded", "PingFang SC", sans-serif;
    }

    .feed {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .person {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      min-height: 92px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
      animation: item-enter var(--motion-enter) var(--motion-standard) both;
      animation-delay: min(calc(var(--order) * 45ms), 360ms);
    }

    .person:last-child {
      border-bottom: 0;
    }

    .avatar-wrap {
      position: relative;
      width: 64px;
      height: 64px;
    }

    .avatar {
      display: block;
      width: 64px;
      height: 64px;
      border: 2px solid var(--surface);
      border-radius: 20px;
      object-fit: cover;
      box-shadow: 0 0 0 1px var(--line);
    }

    .presence {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 18px;
      height: 18px;
      border: 3px solid var(--surface);
      border-radius: 50%;
      background: var(--resting);
    }

    .presence[data-online="true"] {
      background: var(--online);
    }

    .person-copy {
      min-width: 0;
    }

    .person-name {
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .person-status {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      margin: 5px 0 0;
      color: var(--text-soft);
      font-size: 13px;
      line-height: 1.45;
    }

    .person-status i {
      flex: 0 0 auto;
      color: var(--status-color);
      font-size: 16px;
    }

    .person-status span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-badge {
      display: inline-flex;
      min-height: 30px;
      align-items: center;
      border-radius: var(--radius-pill);
      padding: 0 10px;
      background: var(--status-soft);
      color: var(--status-color);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .person[data-status="online"] {
      --status-color: #3d8b25;
      --status-soft: var(--online-soft);
    }

    .person[data-status="reading"] {
      --status-color: #b94f08;
      --status-soft: var(--reading-soft);
    }

    .person[data-status="creating"] {
      --status-color: #7543b2;
      --status-soft: var(--creating-soft);
    }

    .person[data-status="resting"] {
      --status-color: #63708a;
      --status-soft: var(--resting-soft);
    }

    .empty {
      display: none;
      padding: 56px 20px;
      text-align: center;
    }

    .empty.is-visible {
      display: block;
    }

    .empty-icon {
      display: grid;
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      place-items: center;
      border-radius: 20px;
      background: var(--yellow-1);
      color: var(--yellow-6);
      font-size: 28px;
    }

    .empty h3 {
      margin: 0;
      color: var(--ink);
      font-size: 18px;
    }

    .empty p {
      margin: 8px 0 0;
      color: var(--text-soft);
      font-size: 14px;
      line-height: 1.6;
    }

    .skeleton {
      display: none;
      padding-top: 6px;
    }

    .skeleton.is-visible {
      display: block;
    }

    .skeleton-row {
      display: grid;
      grid-template-columns: 64px 1fr 58px;
      align-items: center;
      gap: 14px;
      min-height: 92px;
      border-bottom: 1px solid var(--line);
    }

    .skeleton-block {
      border-radius: 8px;
      background: var(--line);
    }

    .skeleton-avatar {
      width: 64px;
      height: 64px;
      border-radius: 20px;
    }

    .skeleton-lines {
      display: grid;
      gap: 9px;
    }

    .skeleton-line {
      height: 12px;
    }

    .skeleton-line:first-child {
      width: 38%;
    }

    .skeleton-line:last-child {
      width: 72%;
    }

    .skeleton-badge {
      height: 30px;
      border-radius: var(--radius-pill);
    }

    .skeleton.is-visible .skeleton-block {
      background:
        linear-gradient(
          90deg,
          var(--line) 25%,
          color-mix(in srgb, var(--surface) 65%, var(--line)) 50%,
          var(--line) 75%
        );
      background-size: 200% 100%;
      animation: shimmer 1.2s ease-in-out infinite;
    }

    .feed[hidden],
    .empty[hidden] {
      display: none;
    }

    :focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 55%, transparent);
      outline-offset: 3px;
    }

    @keyframes item-enter {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shimmer {
      from {
        background-position: 200% 0;
      }
      to {
        background-position: -200% 0;
      }
    }

    @media (min-width: 800px) {
      body {
        padding: 32px;
      }

      .app {
        min-height: calc(100dvh - 64px);
        overflow: clip;
        border: 1px solid rgba(64, 64, 64, 0.08);
        border-radius: 32px;
        box-shadow: var(--shadow-soft);
      }

      .topbar {
        border-radius: 32px 32px 0 0;
      }

      .content {
        padding-right: 32px;
        padding-left: 32px;
      }
    }

    @media (max-width: 420px) {
      .brand-copy span {
        display: none;
      }

      .person {
        grid-template-columns: 58px minmax(0, 1fr) auto;
        gap: 12px;
      }

      .avatar-wrap,
      .avatar {
        width: 58px;
        height: 58px;
      }

      .status-badge {
        min-height: 28px;
        padding: 0 8px;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #f4efd8;
        --text: #efede5;
        --text-soft: #b7b3a8;
        --text-faint: #8e8a80;
        --surface: #24231f;
        --surface-soft: #2d2b26;
        --line: #3b3932;
        --page: #191814;
        --yellow-1: #3b3516;
        --yellow-2: #51471a;
        --yellow-6: #f6df66;
        --online-soft: #223a1c;
        --reading-soft: #41281c;
        --creating-soft: #342743;
        --resting-soft: #2c303b;
        --shadow-soft: 0 18px 56px rgba(0, 0, 0, 0.34);
      }

      .welcome {
        border-color: #66571a;
      }

      .person[data-status="online"] {
        --status-color: #9ee084;
      }

      .person[data-status="reading"] {
        --status-color: #ffb27d;
      }

      .person[data-status="creating"] {
        --status-color: #d0adfb;
      }

      .person[data-status="resting"] {
        --status-color: #b9c4da;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }
    }

    @supports not (backdrop-filter: blur(1px)) {
      .topbar {
        background: var(--surface);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand" aria-label="JOJO 一起学习">
        <span class="brand-mark" aria-hidden="true">J</span>
        <span class="brand-copy">
          <strong>一起学习</strong>
          <span>看看小伙伴们正在做什么</span>
        </span>
      </div>
      <button class="icon-button" id="refreshButton" type="button" aria-label="刷新动态">
        <i class="ph-fill ph-arrows-clockwise" aria-hidden="true"></i>
      </button>
    </header>

    <div class="content">
      <section class="welcome" aria-labelledby="welcomeTitle">
        <h1 id="welcomeTitle">今天也和兴趣见面吧</h1>
        <p>这里展示的是虚构社区成员和示例状态，不包含真实儿童信息。</p>
      </section>

      <label class="search">
        <i class="ph-fill ph-magnifying-glass" aria-hidden="true"></i>
        <input id="searchInput" type="search" placeholder="搜索小伙伴" autocomplete="off">
      </label>

      <nav class="filters" aria-label="动态筛选">
        <button class="filter" type="button" data-filter="all" aria-pressed="true">全部</button>
        <button class="filter" type="button" data-filter="online" aria-pressed="false">在线</button>
        <button class="filter" type="button" data-filter="reading" aria-pressed="false">阅读中</button>
        <button class="filter" type="button" data-filter="creating" aria-pressed="false">创作中</button>
        <button class="filter" type="button" data-filter="resting" aria-pressed="false">休息中</button>
      </nav>

      <div class="section-head">
        <h2>小伙伴动态</h2>
        <span id="resultCount" aria-live="polite">16 人</span>
      </div>

      <div class="skeleton" id="skeleton" aria-hidden="true">
        <div class="skeleton-row">
          <span class="skeleton-block skeleton-avatar"></span>
          <span class="skeleton-lines">
            <span class="skeleton-block skeleton-line"></span>
            <span class="skeleton-block skeleton-line"></span>
          </span>
          <span class="skeleton-block skeleton-badge"></span>
        </div>
        <div class="skeleton-row">
          <span class="skeleton-block skeleton-avatar"></span>
          <span class="skeleton-lines">
            <span class="skeleton-block skeleton-line"></span>
            <span class="skeleton-block skeleton-line"></span>
          </span>
          <span class="skeleton-block skeleton-badge"></span>
        </div>
        <div class="skeleton-row">
          <span class="skeleton-block skeleton-avatar"></span>
          <span class="skeleton-lines">
            <span class="skeleton-block skeleton-line"></span>
            <span class="skeleton-block skeleton-line"></span>
          </span>
          <span class="skeleton-block skeleton-badge"></span>
        </div>
      </div>

      <ul class="feed" id="feed" aria-label="社区成员动态"></ul>

      <section class="empty" id="emptyState" aria-labelledby="emptyTitle">
        <span class="empty-icon" aria-hidden="true">
          <i class="ph-fill ph-binoculars"></i>
        </span>
        <h3 id="emptyTitle">还没找到这位小伙伴</h3>
        <p>换个昵称试试，或者切回全部动态。</p>
      </section>
    </div>
  </main>

  <script>
    const members = [
      { name: "小满同学", avatar: "001", status: "online", badge: "在线", icon: "ph-hand-waving", detail: "刚刚来到了兴趣广场", online: true },
      { name: "桃子汽水", avatar: "002", status: "reading", badge: "阅读中", icon: "ph-book-open-text", detail: "正在读《月亮邮局》", online: true },
      { name: "阿沐", avatar: "003", status: "online", badge: "在线", icon: "ph-chat-circle-dots", detail: "想找人一起聊恐龙", online: true },
      { name: "小葵花", avatar: "004", status: "creating", badge: "创作中", icon: "ph-palette", detail: "正在画春天的第一朵花", online: true },
      { name: "蓝莓团子", avatar: "005", status: "reading", badge: "阅读中", icon: "ph-books", detail: "收藏了 3 个科学故事", online: true },
      { name: "栗子同学", avatar: "006", status: "creating", badge: "创作中", icon: "ph-pencil-line", detail: "写下了一首四行小诗", online: true },
      { name: "青禾", avatar: "007", status: "online", badge: "在线", icon: "ph-rocket-launch", detail: "完成了今天的思维挑战", online: true },
      { name: "小雨点", avatar: "008", status: "resting", badge: "休息中", icon: "ph-moon-stars", detail: "晚一点再回来看看", online: false },
      { name: "棉花糖", avatar: "009", status: "reading", badge: "阅读中", icon: "ph-bookmark-simple", detail: "读到了森林故事的结尾", online: true },
      { name: "积木小队长", avatar: "010", status: "online", badge: "在线", icon: "ph-cube", detail: "分享了一个积木新点子", online: true },
      { name: "星星糖", avatar: "011", status: "creating", badge: "创作中", icon: "ph-music-notes", detail: "在为故事编一段旋律", online: true },
      { name: "小松塔", avatar: "012", status: "resting", badge: "休息中", icon: "ph-cloud-sun", detail: "今天已经打卡啦", online: false },
      { name: "果冻船长", avatar: "013", status: "online", badge: "在线", icon: "ph-compass", detail: "正在探索宇宙主题", online: true },
      { name: "米粒儿", avatar: "014", status: "reading", badge: "阅读中", icon: "ph-binoculars", detail: "发现了一本昆虫图鉴", online: true },
      { name: "北北", avatar: "015", status: "resting", badge: "休息中", icon: "ph-coffee", detail: "明天继续完成小实验", online: false },
      { name: "糖豆包", avatar: "016", status: "creating", badge: "创作中", icon: "ph-scissors", detail: "做了一张彩纸小贺卡", online: true }
    ];

    const feed = document.querySelector("#feed");
    const filters = [...document.querySelectorAll(".filter")];
    const searchInput = document.querySelector("#searchInput");
    const resultCount = document.querySelector("#resultCount");
    const emptyState = document.querySelector("#emptyState");
    const refreshButton = document.querySelector("#refreshButton");
    const skeleton = document.querySelector("#skeleton");
    let activeFilter = "all";

    function memberTemplate(member, order) {
      return `
        <li class="person" data-status="${member.status}" style="--order: ${order}">
          <span class="avatar-wrap">
            <img
              class="avatar"
              src="assets/avatars/avatar-${member.avatar}.png"
              width="256"
              height="256"
              alt="${member.name}的虚构插画头像"
              loading="${order < 4 ? "eager" : "lazy"}"
              decoding="async"
            >
            <span
              class="presence"
              data-online="${member.online}"
              title="${member.online ? "当前在线" : "当前离线"}"
              aria-label="${member.online ? "当前在线" : "当前离线"}"
            ></span>
          </span>
          <span class="person-copy">
            <strong class="person-name">${member.name}</strong>
            <span class="person-status">
              <i class="ph-fill ${member.icon}" aria-hidden="true"></i>
              <span>${member.detail}</span>
            </span>
          </span>
          <span class="status-badge">${member.badge}</span>
        </li>
      `;
    }

    function render() {
      const query = searchInput.value.trim().toLowerCase();
      const visibleMembers = members.filter((member) => {
        const matchesStatus = activeFilter === "all" || member.status === activeFilter;
        const matchesQuery = !query || `${member.name}${member.detail}${member.badge}`.toLowerCase().includes(query);
        return matchesStatus && matchesQuery;
      });

      feed.innerHTML = visibleMembers.map(memberTemplate).join("");
      resultCount.textContent = `${visibleMembers.length} 人`;
      const isEmpty = visibleMembers.length === 0;
      feed.hidden = isEmpty;
      emptyState.classList.toggle("is-visible", isEmpty);
      emptyState.hidden = !isEmpty;
    }

    filters.forEach((filter) => {
      filter.addEventListener("click", () => {
        activeFilter = filter.dataset.filter;
        filters.forEach((item) => {
          item.setAttribute("aria-pressed", String(item === filter));
        });
        render();
      });
    });

    searchInput.addEventListener("input", render);

    refreshButton.addEventListener("click", () => {
      refreshButton.disabled = true;
      refreshButton.setAttribute("aria-label", "正在刷新动态");
      feed.hidden = true;
      emptyState.hidden = true;
      skeleton.classList.add("is-visible");
      window.setTimeout(() => {
        skeleton.classList.remove("is-visible");
        refreshButton.disabled = false;
        refreshButton.setAttribute("aria-label", "刷新动态");
        render();
      }, 720);
    });

    render();
  </script>
</body>
</html>
