<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="打开动画片，授权摄像头和麦克风，立即录下孩子的真实反应。视频只在当前设备生成。"
    />
    <meta name="application-name" content="Intermotion" />
    <meta name="apple-mobile-web-app-title" content="Intermotion" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link
      rel="canonical"
      href="https://JOJOdemos.mikeywa.icu/intermotion/"
    />
    <script>
      (() => {
        const icons = [4, 7, 8];
        const selected = icons[Math.floor(Math.random() * icons.length)];
        const iconPath = `icons/intermotion-favicon-${selected}.png`;
        const appIconPath = `icons/intermotion-icon-${selected}.png`;
        const favicon = document.createElement("link");
        favicon.rel = "icon";
        favicon.type = "image/png";
        favicon.sizes = "96x96";
        favicon.href = `${iconPath}?v=${selected}`;
        document.head.appendChild(favicon);
        const appleIcon = document.createElement("link");
        appleIcon.rel = "apple-touch-icon";
        appleIcon.sizes = "1024x1024";
        appleIcon.href = `${appIconPath}?v=${selected}`;
        document.head.appendChild(appleIcon);
      })();
    </script>
    <link rel="manifest" href="/intermotion/site.webmanifest" />
    <title>童趣反应视频</title>
    <script type="module" crossorigin src="/intermotion/assets/intermotion-B8fm3qgz.js"></script>
    <link rel="stylesheet" crossorigin href="/intermotion/assets/intermotion-aNr2i1MU.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
