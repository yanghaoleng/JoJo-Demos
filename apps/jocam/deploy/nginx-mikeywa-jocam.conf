# Keep the public URL on mikeywa.site while the app and large assets live on
# the faster Tencent Lighthouse origin.
location = /jocam {
    return 308 /jocam/;
}

location = /jocam/api/voice {
    proxy_pass https://rive.mikeywa.site/jocam/api/voice;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host rive.mikeywa.site;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 310s;
}

location ^~ /jocam/ {
    proxy_pass https://rive.mikeywa.site/jocam/;
    proxy_ssl_server_name on;
    proxy_set_header Host rive.mikeywa.site;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_hide_header Permissions-Policy;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
}
