# Serve JOCAM directly from the Tencent Lighthouse origin.
location = /jocam {
    return 308 /jocam/;
}

location = /jocam/ {
    rewrite ^ /jocam/index.html last;
}

location = /jocam/index.html {
    alias /var/www/jocam/current/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

location = /jocam/api/voice {
    proxy_pass http://127.0.0.1:8787/voice;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 310s;
    proxy_send_timeout 30s;
}

location = /jocam/api/health {
    proxy_pass http://127.0.0.1:8787/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "no-store" always;
}

location ^~ /jocam/ {
    alias /var/www/jocam/current/;
    gzip_static on;
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
