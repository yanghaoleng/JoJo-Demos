  <title>叫叫 · 家长成长沟通 Demo</title>
  <style>
    :root{--paper:#fdf7eb;--brown:#684218;--brown-2:#986c31;--orange:#ef963e;--muted:#a87d50;--line:#e9cfab;--cream:#fff9ef;--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:var(--sans);background:var(--paper);color:var(--brown);-webkit-font-smoothing:antialiased}.page{min-height:100dvh;padding:28px clamp(20px,5vw,76px) 42px;background:radial-gradient(circle at 95% 4%,#ffe0a4 0,transparent 29%),radial-gradient(circle at 4% 94%,#fff0cf 0,transparent 27%),var(--paper)}.top{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;letter-spacing:.08em;color:#975f25}.top i{display:block;width:9px;height:9px;border-radius:3px;background:var(--orange);transform:rotate(45deg)}.layout{display:grid;grid-template-columns:180px minmax(0,1fr);gap:clamp(28px,6vw,100px);max-width:1280px;margin:clamp(45px,9vh,110px) auto 0}.timeline{position:relative;padding:2px 0}.timeline:before{content:"";position:absolute;top:31px;bottom:31px;left:15px;border-left:1px dashed #d5ae7c}.time-btn{position:relative;z-index:1;display:flex;align-items:center;gap:13px;width:100%;padding:13px 8px;border:0;border-radius:13px;background:transparent;color:#987a5b;text-align:left;cursor:pointer;transition:background .22s,color .22s}.time-btn:hover,.time-btn[aria-selected="true"]{background:#fff0d3;color:var(--brown)}.time-num{display:grid;place-items:center;width:31px;height:31px;flex:none;border:1px solid #dcbd92;border-radius:50%;background:var(--paper);font-size:11px;font-weight:800}.time-btn[aria-selected="true"] .time-num{border-color:var(--orange);background:var(--orange);color:white;box-shadow:0 0 0 5px #ffedcf}.time-btn b,.time-btn small{display:block}.time-btn b{font-size:15px}.time-btn small{margin-top:2px;font-size:11px;color:#ac8c6b}.flow{min-width:0}.stage-note{margin:0;color:#b5702e;font-size:12px;font-weight:700;letter-spacing:.1em}.flow h1{margin:7px 0 0;font-size:clamp(26px,3.6vw,46px);line-height:1.18;letter-spacing:-.05em}.step-strip{display:flex;gap:8px;align-items:center;overflow-x:auto;margin:28px -4px 0;padding:4px;scrollbar-width:thin}.step{display:inline-flex;align-items:center;gap:7px;flex:none;padding:8px 12px;border:0;border-radius:99px;background:#f3e4cf;color:#a78661;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}.step b{display:grid;place-items:center;width:19px;height:19px;border-radius:50%;background:#ddbd93;color:white;font-size:10px}.step.active{background:#ffe5bb;color:#85501a}.step.active b{background:var(--orange)}.screen-stage{display:grid;place-items:center;min-height:min(64vh,740px);margin-top:17px}.screen{display:flex;gap:clamp(22px,4vw,62px);align-items:center;justify-content:center;width:100%;animation:in .36s cubic-bezier(.2,.8,.2,1) both}.shot-button{position:relative;display:block;padding:0;border:0;background:transparent;cursor:pointer;border-radius:23px;box-shadow:0 24px 50px #6e471d26;overflow:hidden;max-width:100%}.shot-button img{display:block;width:auto;max-width:min(100%,335px);max-height:min(62vh,650px);border-radius:22px}.shot-button.wide img{max-width:min(100%,710px)}.shot-button:focus-visible,.reset-flow:focus-visible,.step:focus-visible,.time-btn:focus-visible{outline:3px solid #e8892c;outline-offset:4px}.shot-tip{position:absolute;right:12px;bottom:12px;padding:7px 10px;border-radius:99px;background:#684218dd;color:#fffaf0;font-size:12px;font-weight:700;opacity:0;transform:translateY(6px);transition:.2s}.shot-button:hover .shot-tip,.shot-button:focus-visible .shot-tip{opacity:1;transform:none}.screen-copy{max-width:282px}.screen-copy span{display:block;color:#bd7d38;font-size:12px;font-weight:700;letter-spacing:.1em}.screen-copy h2{margin:8px 0;color:var(--brown);font-size:clamp(21px,2.4vw,30px);line-height:1.3;letter-spacing:-.04em}.screen-copy p{margin:0;color:#967452;font-size:14px;line-height:1.75}.screen-copy .click-note{margin-top:13px;color:#bd7d38;font-size:12px;font-weight:700}.report-view{display:flex;gap:clamp(22px,4vw,62px);align-items:center;justify-content:center;width:100%;animation:in .36s cubic-bezier(.2,.8,.2,1) both}.report-phone{position:relative;width:min(100%,375px);height:min(69vh,680px);overflow:hidden;border:7px solid #4e3520;border-radius:32px;background:#fff;box-shadow:0 25px 56px #6e471d35}.report-phone.stage{border-color:#986c31;background:#fef7e5}.report-scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;background:#f4f5fb;scrollbar-width:thin;scrollbar-color:#d5ae7c transparent}.report-scroll::-webkit-scrollbar{width:6px}.report-scroll::-webkit-scrollbar-thumb{background:#d5ae7c;border-radius:99px}.report-scroll img{display:block;width:100%;height:auto}.report-scroll .raw-block{width:100%;display:block}.scroll-hint{position:absolute;right:12px;top:12px;z-index:2;padding:7px 10px;border-radius:99px;background:#684218e8;color:#fffaf0;font-size:11px;font-weight:700;pointer-events:none}.detail-copy{max-width:290px}.detail-copy span{display:block;color:#bd7d38;font-size:12px;font-weight:700;letter-spacing:.1em}.detail-copy h2{margin:8px 0;color:var(--brown);font-size:clamp(21px,2.4vw,30px);line-height:1.3;letter-spacing:-.04em}.detail-copy p{margin:0;color:#967452;font-size:14px;line-height:1.75}.reset-flow{margin-top:18px;padding:10px 14px;border:1px solid #d9b98f;border-radius:11px;background:transparent;color:#85501a;font:700 13px var(--sans);cursor:pointer}.continuation{padding:14px 20px 32px;background:#f7f8fc}.continuation.month{background:#f6f7fb}.continuation.stage-flow{background:linear-gradient(#c09660,#fef7e5 12%);padding-top:21px}.source-label{margin:0 0 11px;color:#8b7199;font-size:12px;font-weight:700}.raw-card{margin:14px 0 0;padding:18px 15px;border-radius:18px;background:#fff;box-shadow:0 4px 16px #1f284d0b;color:#1f284d}.raw-card h3{margin:0 0 10px;font-size:19px;line-height:1.35}.raw-card h4{margin:18px 0 8px;font-size:16px}.raw-card p,.raw-card li{margin:0;color:#596689;font-size:14px;line-height:1.7}.raw-card ol{margin:0;padding-left:20px}.data-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.data-cell{padding:11px 10px;border-radius:12px;background:#f0f4ff}.data-cell b{display:block;color:#3e609b;font-size:18px}.data-cell span{display:block;margin-top:2px;color:#7a88a6;font-size:12px}.lesson-list{margin-top:11px}.lesson-row{display:flex;justify-content:space-between;gap:8px;padding:12px 0;border-top:1px solid #edf0f6;font-size:14px}.lesson-row b{font-size:14px}.lesson-row span{color:#8792aa;font-size:12px;white-space:nowrap}.stage-card{margin:16px 0 0;padding:18px 14px;border-radius:22px;background:#fff;box-shadow:0 0 10px #00000008;color:#664314}.stage-card h3{margin:0 0 12px;font-size:20px}.stage-card p{margin:0;font-size:14px;line-height:1.7;color:#765f41}.metric-row{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:11px 0;background:#f0dcc2}.metric{padding:11px;background:#fff}.metric b{display:block;font-size:23px}.metric span{display:block;margin-top:3px;color:#806b53;font-size:13px}.course-line{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;border-top:1px solid #f0dcc2}.course-line:first-of-type{border-top:0}.course-line b{font-size:16px}.course-line small{display:block;margin-top:3px;color:#8e7659;font-size:12px}.course-line em{font-style:normal;color:#986c31}.work-tabs{display:flex;gap:16px;padding-bottom:10px;border-bottom:2px solid #f3e9d8;color:#b2b2b2;font-size:14px}.work-tabs b{color:#664314;border-bottom:3px solid #fcda00;padding-bottom:7px}.booking{display:flex;align-items:center;justify-content:space-between;gap:10px}.booking b{font-size:17px}.booking span{display:block;color:#c09660;font-size:12px;margin-top:3px}.booking button{border:1px solid #ffd738;border-radius:16px;background:#fff;color:#6b410b;padding:7px 13px;font:700 13px var(--sans)}@keyframes in{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}@media(max-width:700px){.page{padding:22px 18px}.layout{grid-template-columns:1fr;gap:28px;margin-top:35px}.timeline{display:flex;gap:5px;overflow:auto;padding:0 0 3px}.timeline:before{display:none}.time-btn{min-width:96px;flex-direction:column;gap:4px;padding:9px;text-align:center}.time-btn small{font-size:9px}.flow h1{font-size:29px}.screen-stage{min-height:0;padding-top:7px}.screen,.report-view{flex-direction:column}.shot-button img{max-width:min(100%,290px);max-height:58vh}.shot-button.wide img{max-width:100%;max-height:48vh}.screen-copy,.detail-copy{max-width:330px;text-align:center}.step-strip{margin-top:21px}.report-phone{height:64vh;max-height:640px}.scroll-hint{top:10px;right:10px}.shot-tip{opacity:1;transform:none;font-size:10px}.detail-copy{padding-bottom:8px}}
  </style>
  <style>
    .timeline:before{left:23.5px}
    .slide-stack{position:relative;display:block;max-width:100%;isolation:isolate}
    .slide-stack .shot-button{position:relative;z-index:2}
    .next-peek{position:absolute;z-index:1;right:-78px;top:50%;width:150px;height:min(52vh,520px);overflow:hidden;border-radius:20px;opacity:.18;filter:saturate(.72);transform:translateY(-50%) scale(.94);box-shadow:0 18px 42px #6e471d1f;pointer-events:none}
    .next-peek img{display:block;width:100%;height:100%;object-fit:cover;object-position:top;border-radius:20px}
    .next-peek.is-course{height:250px;background:#fbf7f1}
    .next-peek iframe{display:block;width:520px;height:920px;border:0;transform:scale(.288);transform-origin:top left;pointer-events:none}
    .screen-copy{position:relative;z-index:3}
    .course-frame{display:block;width:100%;height:100%;border:0;background:#fbf7f1}
    .long-report-image{display:block;width:100%;height:auto}
    .screen,.report-view{flex-direction:column;gap:18px}
    .page-title{margin:0;max-width:680px;color:var(--brown);font-size:clamp(21px,2.4vw,30px);line-height:1.3;letter-spacing:-.04em;text-align:center}
    .paired-pages{display:flex;align-items:flex-end;justify-content:center;gap:clamp(18px,3vw,40px);max-width:100%}
    .page-card{display:flex;flex-direction:column;align-items:center;gap:14px;margin:0;min-width:0}
    .page-card .shot-button img{max-width:min(42vw,560px);max-height:min(54vh,560px);object-fit:contain}
    .page-card .page-title{max-width:430px;font-size:clamp(18px,2vw,25px)}
    .pair-stack{max-width:100%}
    .pair-stack .next-peek{right:-58px}
    .stage-pair .report-phone{width:min(38vw,340px);height:min(62vh,640px)}
    .stage-cover-page{width:100%;height:100%;object-fit:contain;background:#fff}
    @media(max-width:700px){.next-peek{right:-28px;width:92px;height:46%;border-radius:14px;opacity:.15}.next-peek.is-course{height:190px}.next-peek iframe{transform:scale(.18)}.slide-stack{max-width:calc(100% - 24px)}.paired-pages{justify-content:flex-start;gap:16px;max-width:100%;overflow-x:auto;padding:0 18px 8px;scroll-snap-type:x proximity}.page-card{flex:none;scroll-snap-align:start}.page-card .shot-button img{max-width:72vw;max-height:52vh}.stage-pair .report-phone{width:285px;height:60vh;max-height:600px}.page-title{font-size:22px}}
  </style>

<body>
  <main class="page">
    <div class="top"><i></i>叫叫 · 家长成长沟通 Demo</div>
    <div class="layout">
      <nav class="timeline" aria-label="时间节点">
        <button class="time-btn" data-stage="daily" aria-selected="true"><span class="time-num">1</span><span><b>每日</b><small>每次学习后</small></span></button>
        <button class="time-btn" data-stage="sunday" aria-selected="false"><span class="time-num">2</span><span><b>每周日晚</b><small>每周日晚 20:00</small></span></button>
        <button class="time-btn" data-stage="monthly" aria-selected="false"><span class="time-num">3</span><span><b>每月</b><small>每月最后一天</small></span></button>
        <button class="time-btn" data-stage="halfyear" aria-selected="false"><span class="time-num">4</span><span><b>阶段</b><small>约每 6 个月</small></span></button>
      </nav>
      <section class="flow" aria-live="polite">
        <p class="stage-note" id="stage-note"></p>
        <h1 id="stage-title"></h1>
        <div class="step-strip" id="step-strip" aria-label="原稿流程步骤"></div>
        <div class="screen-stage" id="screen-stage"></div>
      </section>
    </div>
  </main>
  <script>
    const flows={
      daily:{note:'每日 · 学习即时反馈',title:'今天完成的学习，今天被看见。',steps:[
        {label:'产品触达',kind:'pair',pages:[{src:'assets/daily-journey-entry.webp',layout:'wide',title:'课程完成后，从环节列表进入学习报告'},{src:'assets/daily-official-account-entry.webp',title:'在叫叫家长中心收到学习完成通知'}]},
        {label:'班班触达',kind:'pair',pages:[{src:'assets/daily-tutor-entry.webp',layout:'wide',title:'指导师后台手动发送学习日报'},{src:'assets/daily-class-chat.webp',title:'班班把学习日报发给家长'}]},
        {label:'学习日报',kind:'detail',detail:'daily',title:'打开日报，向上滑动查看完整学习信息流'}]},
      sunday:{note:'每周日晚 · 下周课程预告',title:'在周末，把下一周的学习安排讲清楚。',steps:[
        {label:'班班触达',kind:'image',src:'assets/weekly-class-chat-updated.webp',title:'班班推送专属阅读成长规划',copy:'原稿中更新后的每周日晚班班消息。'},
        {label:'下周课程预告',kind:'course',title:'打开下周课程预告',copy:'直接呈现课程预告页面中的课表、重点提炼与课程价值。'}]},
      monthly:{note:'每月 · 学习月报',title:'一个月的积累，值得被认真看见。',steps:[
        {label:'指导师发送',kind:'image',src:'assets/monthly-tutor-message.webp',title:'指导师发送家长端月报入口',copy:'原稿中的班班消息与“点击查看”入口。'},
        {label:'学习月报',kind:'detail',detail:'monthly',title:'打开月报告，向上滑动查看完整主题月信息流'}]},
      halfyear:{note:'约半年 · 阶段成长报告',title:'让长期成长，也有一份郑重的记录。',steps:[
        {label:'班班发送',kind:'image',src:'assets/stage-class-chat.webp',title:'班班发送阶段成长报告',copy:'原稿中的阶段报告小程序卡片。'},
        {label:'阶段报告',kind:'stagePair',pages:[{src:'assets/stage-cover.webp',title:'阶段报告封面'},{src:'assets/stage-report-long.webp',title:'完整阶段报告'}]}]}
    };
    let stage='daily',step=0;
    const q=s=>document.querySelector(s),qa=s=>document.querySelectorAll(s);
    const detailAssets={daily:'assets/daily-report-long.webp',monthly:'assets/monthly-report-long.webp',stage:'assets/stage-report-long.webp'};
    const nextPeek=item=>{if(!item)return'';if(item.kind==='course')return`<span class="next-peek is-course" aria-hidden="true"><iframe src="assets/course-preview.html" tabindex="-1" loading="lazy"></iframe></span>`;const src=item.kind==='detail'?detailAssets[item.detail]:item.kind==='pair'||item.kind==='stagePair'?item.pages[0].src:item.src;return`<span class="next-peek" aria-hidden="true"><img src="${src}" alt="" loading="eager" decoding="async" /></span>`};
    const imageSlide=(item,next)=>`<div class="screen"><div class="slide-stack"><button class="shot-button ${item.layout==='wide'?'wide':''}" data-next aria-label="点击${item.label}查看下一步"><img src="${item.src}" alt="Figma 原稿：${item.label}" loading="eager" decoding="async" /></button>${nextPeek(next)}</div><h2 class="page-title">${item.title}</h2></div>`;
    const pairSlide=(item,next)=>`<div class="screen"><div class="slide-stack pair-stack"><div class="paired-pages">${item.pages.map(page=>`<figure class="page-card"><button class="shot-button ${page.layout==='wide'?'wide':''}" data-next aria-label="点击${page.title}查看下一步"><img src="${page.src}" alt="${page.title}" loading="eager" decoding="async" /></button><figcaption class="page-title">${page.title}</figcaption></figure>`).join('')}</div>${nextPeek(next)}</div></div>`;
    const stagePairSlide=item=>`<div class="screen"><div class="paired-pages stage-pair"><figure class="page-card"><div class="report-phone stage"><img class="stage-cover-page" src="${item.pages[0].src}" alt="阶段报告封面" loading="eager" decoding="async" /></div><figcaption class="page-title">${item.pages[0].title}</figcaption></figure><figure class="page-card"><div class="report-phone stage"><div class="report-scroll"><img class="long-report-image" src="${item.pages[1].src}" alt="完整拉长版阶段报告" loading="eager" decoding="async" /></div></div><figcaption class="page-title">${item.pages[1].title}</figcaption></figure></div></div>`;
    const dailyDetail=()=>`<div class="report-view"><div class="report-phone"><span class="scroll-hint">向上滑动查看完整原稿信息流</span><div class="report-scroll"><img src="assets/daily-report-screen.webp" alt="Figma 原稿学习日报首屏" /><section class="continuation"><p class="source-label">日报信息流 · Figma 原稿延续内容</p><img class="raw-block" src="assets/daily-calendar-block.webp" alt="日报日历与连续学习数据" /><img class="raw-block" src="assets/daily-learning-title-block.webp" alt="今日学情与课时名称" /><img class="raw-block" src="assets/daily-learning-data-block.webp" alt="学习数据与我的作品" /><div class="raw-card"><h3>学习数据</h3><div class="data-grid"><div class="data-cell"><b>999 字</b><span>绘本数量</span></div><div class="data-cell"><b>68 次</b><span>阅读字数</span></div><div class="data-cell"><b>8 次</b><span>Setting 场景</span></div><div class="data-cell"><b>3 次</b><span>主旨理解</span></div></div><h4>今日学习建议</h4><p>完成当前课时后，可继续复习“蝙蝠的构造”中的重点表达；把今天的学习收获沉淀成自己的作品。</p><div class="lesson-list"><div class="lesson-row"><b>第3次 蝙蝠的构造</b><span>校内同步练</span></div><div class="lesson-row"><b>第4次 蝙蝠的构造</b><span>继续学习</span></div></div></div><img class="raw-block" src="assets/daily-highlight-block.webp" alt="日报高光时刻原稿内容" /><div class="raw-card"><h3>吐槽及建议</h3><p>日报将当天学情、学习数据与作品高光连续呈现，方便家长回看与陪伴。</p></div></section></div></div><div class="detail-copy"><span>日报详情</span><h2>一份可以慢慢向上浏览的学习信息流</h2><p>从今日学情、学习数据、作品高光到建议，保留原稿的纵向阅读节奏。</p><button class="reset-flow" data-reset>重新演示每日触达</button></div></div>`;
    const monthlyDetail=()=>`<div class="report-view"><div class="report-phone"><span class="scroll-hint">向上滑动查看完整原稿信息流</span><div class="report-scroll"><img src="assets/figma-monthly-report.webp" alt="Figma 原稿月报告首屏" /><section class="continuation month"><p class="source-label">月报信息流 · Figma 原稿主题月内容</p><img class="raw-block" src="assets/monthly-report-flow.webp" alt="月报主题月总结与学习建议" /><div class="raw-card"><h3>主题月总结</h3><p>本周孩子已经坚持学习了18次，还有2次未完成学习，请及时补读哦。</p><h4>学习建议</h4><ol><li>从习惯上，本周孩子已经坚持学习了18次，还有2次未完成学习，请及时补读。</li><li>从答题上，宝贝本月答对10/40，在信息提取、推论分析方面表现突出，但在基础识记、理解整合方面还有待加强。</li><li>家长可以带宝贝玩一些找不同的游戏，在陪伴中巩固本月的学习收获。</li></ol></div><div class="raw-card"><h3>单元学习进度</h3><p>二单元 · 神奇动物会说话</p><p>学习进度 26/28。将每个主题月的学习过程、学习总结与下一步建议连续记录下来。</p></div><div class="raw-card"><h3>活动与反馈</h3><p>查看本月学习活动、作品沉淀及家长可参与的陪伴方式。</p></div></section></div></div><div class="detail-copy"><span>月报详情</span><h2>把整月的进展，做成可连续阅读的主题月记录</h2><p>报告不只停在首屏；向上滑动可连续查看总结、建议、单元进度与反馈。</p><button class="reset-flow" data-reset>重新演示每月触达</button></div></div>`;
    const stageDetail=()=>`<div class="report-view"><div class="report-phone stage"><span class="scroll-hint">向上滑动查看完整原稿信息流</span><div class="report-scroll"><img src="assets/stage-report-first-screen.webp" alt="Figma 原稿阶段报告首屏" /><section class="continuation stage-flow"><p class="source-label">阶段报告 · Figma 原稿完整信息流</p><img class="raw-block" src="assets/stage-report-flow-1.webp" alt="阶段报告学习习惯、效果与核心收获" /><div class="stage-card"><h3>阅读技巧</h3><div class="course-line"><div><b>阅读理解技巧</b><small>已学20课时 · 掌握率86%</small></div><em>查看</em></div><div class="course-line"><div><b>中国文学名著</b><small>精读12篇 · 已全部完成</small></div><em>查看</em></div><div class="course-line"><div><b>外国文学名著</b><small>精读4篇 · 已全部完成</small></div><em>查看</em></div></div><img class="raw-block" src="assets/stage-report-flow-2.webp" alt="菠萝班班阶段评语原稿内容" /><div class="stage-card"><h3>班班评语</h3><p>整体答题正确率高于班级平均；在赏析句子和文言翻译板块可继续通过课程练习巩固。每天及时提交作业，掌握后会有明显提升。</p><div class="metric-row"><div class="metric"><b>87%</b><span>答题正确率</span></div><div class="metric"><b>76%</b><span>改错成功率</span></div></div></div><div class="stage-card"><h3>读后作品输出</h3><div class="work-tabs"><b>作文1</b><span>作文2</span><span>作文3</span></div><p style="margin-top:12px">原稿在此继续呈现作品内容、学习回顾和能力发展，让家长在一条纵向信息流中完成回看。</p></div><div class="stage-card booking"><div><b>预约班班报告解读</b><span>菠萝老师 1 对 1 学情沟通</span></div><button type="button">预约</button></div></section></div></div><div class="detail-copy"><span>阶段报告详情</span><h2>从阶段总结到课程回顾，完整保留为长信息流</h2><p>先看封面，再进入可纵向浏览的阶段报告：学习习惯、效果、核心收获、课程与班班解读。</p><button class="reset-flow" data-reset>重新演示阶段触达</button></div></div>`;
    const detailSlide=item=>{const titles={daily:'完整学习日报',monthly:'完整学习月报',stage:'完整阶段报告'};return`<div class="report-view"><div class="report-phone ${item.detail==='stage'?'stage':''}"><div class="report-scroll"><img class="long-report-image" src="${detailAssets[item.detail]}" alt="${titles[item.detail]}" loading="eager" decoding="async" /></div></div><h2 class="page-title">${titles[item.detail]}</h2></div>`};
    const courseSlide=()=>`<div class="report-view"><div class="report-phone"><iframe class="course-frame" src="assets/course-preview.html" title="本周课程预告：解释词语的方法"></iframe></div><h2 class="page-title">完整课程预告</h2></div>`;
    function render(){const flow=flows[stage],item=flow.steps[step],next=flow.steps[step+1];q('#stage-note').textContent=flow.note;q('#stage-title').textContent=flow.title;qa('.time-btn').forEach(b=>b.setAttribute('aria-selected',b.dataset.stage===stage));q('#step-strip').innerHTML=flow.steps.map((part,index)=>`<button class="step ${index===step?'active':''}" data-step="${index}" ${index===step?'aria-current="step"':''}><b>${index+1}</b><span>${part.label}</span></button>`).join('');q('#screen-stage').innerHTML=item.kind==='image'?imageSlide(item,next):item.kind==='pair'?pairSlide(item,next):item.kind==='stagePair'?stagePairSlide(item):item.kind==='course'?courseSlide():detailSlide(item);q('#screen-stage').querySelectorAll('[data-next]').forEach(button=>button.addEventListener('click',()=>{step=(step+1)%flow.steps.length;render()}));qa('.step').forEach(button=>button.addEventListener('click',()=>{step=Number(button.dataset.step);render()}));}
    qa('.time-btn').forEach(button=>button.addEventListener('click',()=>{stage=button.dataset.stage;step=0;render()}));render();
  </script>
